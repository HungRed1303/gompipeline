services:
  postgres:
    image: postgres:16-alpine
    container_name: gom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gom
      POSTGRES_PASSWORD: gom123
      POSTGRES_DB: gom_pipeline
    ports:
      - "5432:5432"
    volumes:
      - gom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gom -d gom_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gom_pgdata:
